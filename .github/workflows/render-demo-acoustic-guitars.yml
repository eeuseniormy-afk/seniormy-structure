name: render-demo-acoustic-guitars
# Renderiza demonstrações de áudio (WAV) com o motor do plugin. Não publica release.
on:
  push:
    branches: [acoustic-guitars]
    paths:
      - 'tools/render_demo.cpp'
      - '.github/workflows/render-demo-acoustic-guitars.yml'

permissions:
  contents: read

concurrency:
  group: render-demo-acoustic-guitars
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependências (JUCE Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libgtk-3-dev
      - name: Configurar
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compilar render_demo
        run: cmake --build build --target render_demo --parallel 4
      - name: Renderizar
        run: |
          set -o pipefail
          P=$(find build -name render_demo -type f -perm -u+x | head -1)
          echo "binário: $P"
          "$P" library demo-wav 20 2>&1 | tee render-log.txt
          ls -la demo-wav
          cp render-log.txt demo-wav/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-guitars-demo-wav
          path: demo-wav/
          retention-days: 14
